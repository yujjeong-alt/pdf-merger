<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 합치기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css">
<style>
  /* KRDS(대한민국 정부 디자인 시스템) 기본값을 따라요. 1rem = 16px 기준으로 바꿔 적었어요. */
  :root {
    --bg: #ffffff;
    --surface: #f4f5f6;          /* 옅은 회색 바탕 */
    --surface-gray: #e6e8ea;     /* surface-gray-subtle */
    --text: #1e2124;             /* text-basic */
    --text-bold: #131416;        /* text-bolder */
    --text-sub: #464c53;         /* text-subtle */
    --text-disabled: #6d7882;    /* text-disabled-on */
    --border: #b1b8be;           /* border-gray */
    --border-light: #cdd1d5;     /* border-gray-light, divider */
    --border-strong: #58616a;    /* input-border, tertiary button border */
    --primary: #256ef4;          /* button-primary-fill */
    --primary-hover: #0b50d0;
    --primary-pressed: #083891;
    --primary-text: #0b50d0;     /* text-primary */
    --primary-soft: #ecf2fe;     /* button-secondary-fill */
    --primary-soft-hover: #d8e5fd;
    --danger: #de3412;           /* border/element-danger */
    --danger-text: #bd2c0f;
    --danger-soft: #fdefec;
    --success: #228738;
    --success-text: #267337;
    --success-soft: #eaf6ec;

    --fs-title: 1.5rem;          /* 24px 모바일 heading-large */
    --fs-sub: 1.1875rem;         /* 19px heading-small */
    --fs-body: 1.0625rem;        /* 17px body-medium */
    --fs-small: 0.9375rem;       /* 15px body-small */
    --fs-btn-lg: 1.1875rem;      /* 19px label-large */

    --radius-sm: 0.375rem;       /* 6px 보통 버튼, 입력 칸 */
    --radius-md: 0.5rem;         /* 8px 큰 버튼, 목록 칸 */
    --radius-lg: 0.75rem;        /* 12px 카드, 올리는 곳 */
  }
  @media (min-width: 1024px) {
    :root { --fs-title: 2rem; }  /* 32px PC heading-large */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard GOV", "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: var(--fs-body);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 1248px; margin: 0 auto; padding: 32px 16px 64px; }
  @media (min-width: 1024px) { .wrap { padding: 48px 24px 80px; } }
  h1 { font-size: var(--fs-title); font-weight: 700; line-height: 1.5; margin: 0; color: var(--text-bold); }
  h2 { font-size: var(--fs-sub); font-weight: 700; line-height: 1.5; margin: 0; color: var(--text-bold); }
  p { margin: 0; }
  .lead { color: var(--text-sub); margin-top: 8px; }
  .small { font-size: var(--fs-small); line-height: 1.5; color: var(--text-sub); }

  .layout { display: grid; gap: 16px; margin-top: 24px; }
  @media (min-width: 880px) {
    .layout { grid-template-columns: 400px 1fr; align-items: start; gap: 24px; }
  }
  .side { display: grid; gap: 16px; }
  .card { background: var(--bg); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 24px 16px; min-width: 0; }
  @media (min-width: 880px) { .card { padding: 32px; } }

  /* 버튼 */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; min-width: 48px;
    padding: 0 16px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text);
    font-size: var(--fs-body); font-weight: 400; line-height: 1.5;
    transition: background-color .15s ease;
  }
  .btn:hover { background: var(--surface); }
  .btn:active { background: var(--surface-gray); }
  .btn[disabled] { cursor: default; color: var(--text-disabled); background: var(--surface-gray); border-color: var(--border-light); }
  .btn-secondary { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-text); font-weight: 700; }
  .btn-secondary:hover { background: var(--primary-soft-hover); }
  .btn-secondary:active { background: var(--primary-soft-hover); }
  .btn-lg { min-height: 56px; border-radius: var(--radius-md); padding: 0 20px; }
  .btn-primary {
    width: 100%;
    background: var(--primary); border-color: var(--primary); color: #ffffff;
    font-size: var(--fs-btn-lg); font-weight: 700;
  }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-primary:active { background: var(--primary-pressed); border-color: var(--primary-pressed); }
  .btn-primary[aria-busy="true"] { cursor: progress; }
  .btn svg { flex: none; width: 20px; height: 20px; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; box-shadow: 0 0 0 4px #ffffff; }

  /* 올리는 곳 */
  .drop {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 8px; padding: 40px 16px;
    background: var(--surface);
    border: 1px dashed var(--border); border-radius: var(--radius-lg);
    transition: border-color .15s ease, background-color .15s ease;
  }
  .drop.is-over { border: 2px solid var(--primary); background: var(--primary-soft); padding: 39px 15px; }
  .drop .icon { width: 48px; height: 48px; color: var(--text-sub); }
  .drop.is-over .icon { color: var(--primary); }
  .drop h2 { margin-top: 4px; }
  .drop .btn { margin-top: 12px; }

  /* 알림: 빨강은 꼭 알려야 하는 오류에만 */
  .notice:empty { display: none; }
  .notice {
    margin-top: 16px;
    display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start;
    padding: 16px; border-radius: var(--radius-md);
    background: var(--danger-soft);
    border: 1px solid var(--danger);
  }
  .layout + .notice, main > .notice { margin-top: 24px; }
  .notice svg { width: 24px; height: 24px; color: var(--danger); }
  .notice strong { display: block; font-weight: 700; color: var(--danger-text); }
  .notice .actions { margin-top: 12px; }

  .merge .small { margin-top: 12px; text-align: center; }
  .field-error:empty { display: none; }
  .field-error {
    margin-top: 12px;
    display: flex; gap: 4px; align-items: flex-start;
    font-size: var(--fs-small); color: var(--danger-text); font-weight: 700;
  }
  .field-error svg { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--danger); }
  .done-msg:empty { display: none; }
  .done-msg {
    margin-top: 16px;
    display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start;
    padding: 16px; border-radius: var(--radius-md);
    background: var(--success-soft); border: 1px solid var(--success);
  }
  .done-msg svg { width: 24px; height: 24px; color: var(--success); }
  .done-msg strong { display: block; font-weight: 700; color: var(--success-text); }
  .done-msg .actions { margin-top: 12px; }
  .merge .done-msg .small { margin-top: 4px; text-align: left; }

  /* 목록 */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 2px solid var(--text-bold); }
  .list-help { margin-top: 12px; }
  .items { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .items:empty { display: none; }
  .item {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 8px 12px; align-items: center;
    padding: 12px 16px 12px 4px;
    border: 1px solid var(--border-light); border-radius: var(--radius-md);
    background: var(--bg);
  }
  .item.is-bad { background: var(--danger-soft); border-color: var(--danger); }
  .handle {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub); cursor: grab; touch-action: none;
  }
  .handle svg { width: 20px; height: 20px; }
  .sortable-chosen .handle { cursor: grabbing; }
  .sortable-ghost { opacity: .4; }
  .sortable-drag { border-color: var(--primary); }
  .meta { min-width: 0; }
  .name { font-weight: 700; color: var(--text-bold); overflow-wrap: anywhere; }
  .btn { white-space: nowrap; }
  .order {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px; margin-right: 8px;
    border-radius: 100px; background: var(--surface-gray); color: var(--text);
    font-size: var(--fs-small); font-weight: 700; vertical-align: 1px;
  }
  .status { display: flex; align-items: flex-start; gap: 4px; margin-top: 4px; }
  .status svg { flex: none; width: 16px; height: 16px; margin-top: 3px; }
  .status.fail { color: var(--danger-text); font-weight: 700; }
  .status.fail svg { color: var(--danger); }
  .reason { margin-top: 2px; color: var(--text); }
  .item-actions { display: flex; gap: 8px; align-items: center; }
  .item-actions .btn { padding: 0 12px; }
  .item-actions .remove { padding: 0; width: 48px; border-color: transparent; background: transparent; }
  .item-actions .remove:hover { background: var(--surface-gray); }
  .item-actions .remove svg { color: var(--text-sub); }
  @media (max-width: 599px) {
    .item { grid-template-columns: 48px 1fr 48px; padding-right: 8px; }
    .item-actions { display: contents; }
    .item-actions .remove { grid-column: 3; grid-row: 1; }
    .item-actions .move-group { grid-column: 2 / -1; grid-row: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  }
  @media (max-width: 359px) {
    .item-actions .move-group { grid-column: 1 / -1; }
  }
  .move-group { display: flex; gap: 8px; }

  /* 빈 화면 */
  .empty { margin-top: 16px; padding: 40px 16px; text-align: center; background: var(--surface); border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .empty[hidden] { display: none; }
  .empty .icon { width: 40px; height: 40px; color: var(--text-sub); margin-bottom: 8px; }
  .empty h3 { margin: 0; font-size: var(--fs-body); font-weight: 700; color: var(--text-bold); }
  .empty p { color: var(--text-sub); }
  .empty .btn { margin-top: 16px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>PDF 합치기</h1>
  <p class="lead">파일은 내 기기 안에서만 합쳐져요. 어디에도 보내지 않아요.</p>

  <div class="notice" id="lib-error" role="alert" aria-live="assertive"></div>

  <div class="layout">
    <div class="side">
      <section class="card" aria-labelledby="upload-title">
        <div class="drop" id="drop">
          <svg class="icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M12 6h17l9 9v25a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <path d="M29 6v9h9" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <path d="M24 34V21m0 0l-5 5m5-5l5 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2 id="upload-title">PDF 파일을 올려 주세요</h2>
          <p class="small">여기로 끌어다 놓거나 버튼을 눌러 골라요</p>
          <button type="button" class="btn btn-secondary" id="pick">파일 고르기</button>
          <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
        </div>
        <div class="notice" id="upload-error" role="alert" aria-live="assertive"></div>
      </section>

      <section class="card merge" aria-labelledby="merge-title">
        <h2 id="merge-title" class="sr-only">합치기</h2>
        <button type="button" class="btn btn-lg btn-primary" id="merge">합치기</button>
        <p class="small" id="merge-hint">목록 순서대로 합쳐서 합친문서.pdf 로 내려받아요</p>
        <p class="field-error" id="merge-error" aria-live="polite"></p>
        <div class="done-msg" id="done-msg" aria-live="polite"></div>
      </section>
    </div>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">올린 파일</h2>
        <p class="small" id="count">0개</p>
      </div>
      <p class="small list-help" id="list-help" hidden>왼쪽 손잡이를 끌거나 위로, 아래로 버튼을 눌러 순서를 바꿔요</p>
      <p class="sr-only" id="live" aria-live="polite"></p>
      <div class="empty" id="empty">
        <svg class="icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="8" y="5" width="20" height="26" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <path d="M14 11h8M14 16h8M14 21h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M32 11v24H14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3>아직 올린 파일이 없어요</h3>
        <p>합칠 PDF 파일을 두 개 이상 올려 주세요</p>
        <button type="button" class="btn btn-secondary" id="pick-empty">파일 고르기</button>
      </div>
      <ul class="items" id="items" aria-label="합칠 순서"></ul>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
(function () {
  'use strict';

  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7 12.3l3.4 3.4 6.6-6.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.3" fill="#fff"/></svg>';
  var ICON_CLOSE = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_UP = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15V5m0 0l-4.5 4.5M10 5l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5v10m0 0l-4.5-4.5M10 15l4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_GRIP = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="7" cy="5" r="1.6"/><circle cx="13" cy="5" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/><circle cx="7" cy="15" r="1.6"/><circle cx="13" cy="15" r="1.6"/></svg>';
  var ICON_DOWNLOAD = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v10m0 0l-4-4m4 4l4-4M4 16h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var OUT_NAME = '합친문서.pdf';
  var $ = function (id) { return document.getElementById(id); };
  var drop = $('drop'), fileInput = $('file');
  var uploadError = $('upload-error'), libError = $('lib-error');
  var mergeBtn = $('merge'), mergeError = $('merge-error'), doneMsg = $('done-msg');
  var itemsEl = $('items'), emptyEl = $('empty'), countEl = $('count'), listHelp = $('list-help'), live = $('live');

  var items = [];   // { id, file, name, pages, bytes, error: null | {title, how} }
  var nextId = 1;
  var lastUrl = null;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function announce(text) { live.textContent = ''; setTimeout(function () { live.textContent = text; }, 30); }

  function showNotice(el, title, desc, btnLabel, onClick) {
    el.innerHTML = ICON_WARN + '<div><strong>' + escapeHtml(title) + '</strong><p>' + escapeHtml(desc) + '</p>' +
      (btnLabel ? '<div class="actions"><button type="button" class="btn">' + escapeHtml(btnLabel) + '</button></div>' : '') + '</div>';
    if (btnLabel) el.querySelector('button').addEventListener('click', onClick);
  }

  var libsOk = !!window.PDFLib;
  if (!libsOk) {
    showNotice(libError, '파일을 합칠 준비를 하지 못했어요', '인터넷이 끊겨서 필요한 도구를 받지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.', '다시 열기', function () { location.reload(); });
  }

  function isPdfName(file) {
    return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  }

  function readBytes(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }

  function inspect(item) {
    return readBytes(item.file).then(function (buf) {
      item.bytes = new Uint8Array(buf);
      var head = String.fromCharCode.apply(null, item.bytes.subarray(0, 1024));
      if (head.indexOf('%PDF-') === -1) {
        item.error = { title: '이 파일은 열 수 없어요', why: 'PDF 파일이 아니거나 망가진 파일이에요.', how: '원래 파일을 다시 받아서 올려 주세요.' };
        return;
      }
      if (!libsOk) return;
      return PDFLib.PDFDocument.load(item.bytes, { updateMetadata: false }).then(function (doc) {
        var n = doc.getPageCount();
        if (!n) {
          item.error = { title: '이 파일은 열 수 없어요', why: '파일 안에 쪽이 없어요.', how: '다른 파일로 다시 올려 주세요.' };
        } else {
          item.pages = n;
        }
      }).catch(function (err) {
        var msg = String(err && (err.name + ' ' + err.message) || '');
        if (/encrypt/i.test(msg)) {
          item.error = { title: '이 파일은 열 수 없어요', why: '암호가 걸려 있어요.', how: '암호를 푼 파일로 다시 올려 주세요.' };
        } else {
          item.error = { title: '이 파일은 열 수 없어요', why: '파일이 망가져 있어요.', how: '원래 파일을 다시 받아서 올려 주세요.' };
        }
      });
    }).catch(function () {
      if (!item.error) item.error = { title: '이 파일은 열 수 없어요', why: '파일을 읽지 못했어요.', how: '파일을 다시 골라 주세요.' };
    });
  }

  function addFiles(fileList) {
    uploadError.innerHTML = '';
    clearResult();
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var skipped = [];
    var added = [];
    files.forEach(function (f) {
      if (!isPdfName(f)) { skipped.push(f.name); return; }
      var it = { id: nextId++, file: f, name: f.name, pages: null, bytes: null, error: null, loading: true };
      items.push(it); added.push(it);
    });
    if (skipped.length) {
      showNotice(uploadError,
        skipped.length === 1 ? skipped[0] + ' 파일은 올리지 않았어요' : '파일 ' + skipped.length + '개는 올리지 않았어요',
        'PDF 파일만 합칠 수 있어요. 이름이 .pdf 로 끝나는 파일을 골라 주세요.',
        '다시 고르기', function () { fileInput.click(); });
    }
    render();
    if (!added.length) return;
    Promise.all(added.map(function (it) {
      return inspect(it).then(function () { it.loading = false; });
    })).then(function () {
      render();
      var bad = added.filter(function (it) { return it.error; }).length;
      announce('파일 ' + added.length + '개를 올렸어요.' + (bad ? ' 그중 ' + bad + '개는 열 수 없어요.' : ''));
    });
  }

  function okItems() { return items.filter(function (it) { return !it.loading && !it.error; }); }

  function itemHtml(it, idx) {
    var status;
    if (it.loading) {
      status = '<p class="status small">쪽수를 세고 있어요</p>';
    } else if (it.error) {
      status = '<p class="status fail small">' + ICON_WARN + '<span>' + escapeHtml(it.error.title) + '</span></p>' +
        '<p class="small reason">' + escapeHtml(it.error.why) + ' ' + escapeHtml(it.error.how) + '</p>';
    } else {
      status = '<p class="status small">' + it.pages + '쪽</p>';
    }
    var first = idx === 0, last = idx === items.length - 1;
    return '<li class="item' + (it.error ? ' is-bad' : '') + '" data-id="' + it.id + '">' +
      '<span class="handle" aria-hidden="true" title="끌어서 순서 바꾸기">' + ICON_GRIP + '</span>' +
      '<div class="meta"><p class="name"><span class="order">' + (idx + 1) + '</span>' + escapeHtml(it.name) + '</p>' + status + '</div>' +
      '<div class="item-actions">' +
        '<div class="move-group">' +
          '<button type="button" class="btn up" data-act="up"' + (first ? ' disabled' : '') + ' aria-label="' + escapeHtml(it.name) + ' 위로 올리기">' + ICON_UP + '<span aria-hidden="true">위로</span></button>' +
          '<button type="button" class="btn down" data-act="down"' + (last ? ' disabled' : '') + ' aria-label="' + escapeHtml(it.name) + ' 아래로 내리기">' + ICON_DOWN + '<span aria-hidden="true">아래로</span></button>' +
        '</div>' +
        '<button type="button" class="btn remove" data-act="remove" aria-label="' + escapeHtml(it.name) + ' 목록에서 빼기">' + ICON_CLOSE + '</button>' +
      '</div>' +
    '</li>';
  }

  function render(focus) {
    itemsEl.innerHTML = items.map(itemHtml).join('');
    emptyEl.hidden = items.length > 0;
    listHelp.hidden = items.length < 2;
    var total = okItems().reduce(function (s, it) { return s + it.pages; }, 0);
    countEl.textContent = items.length ? items.length + '개 · 모두 ' + total + '쪽' : '0개';
    if (focus) {
      var li = itemsEl.querySelector('[data-id="' + focus.id + '"]');
      var btn = li && li.querySelector('[data-act="' + focus.act + '"]');
      if (btn && btn.disabled) btn = li.querySelector('[data-act="' + (focus.act === 'up' ? 'down' : 'up') + '"]');
      if (btn) btn.focus();
    }
  }

  function clearResult() {
    mergeError.innerHTML = '';
    doneMsg.innerHTML = '';
  }

  itemsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var li = btn.closest('.item');
    var id = Number(li.getAttribute('data-id'));
    var idx = items.findIndex(function (it) { return it.id === id; });
    if (idx < 0) return;
    var act = btn.getAttribute('data-act');
    var it = items[idx];
    clearResult();
    if (act === 'remove') {
      items.splice(idx, 1);
      render();
      var next = itemsEl.children[Math.min(idx, items.length - 1)];
      if (next) next.querySelector('.remove').focus(); else $('pick').focus();
      announce(it.name + ' 파일을 뺐어요');
    } else {
      var to = act === 'up' ? idx - 1 : idx + 1;
      if (to < 0 || to >= items.length) return;
      items.splice(idx, 1);
      items.splice(to, 0, it);
      render({ id: id, act: act });
      announce(it.name + ' 파일이 ' + (to + 1) + '번째가 됐어요');
    }
  });

  if (window.Sortable) {
    Sortable.create(itemsEl, {
      handle: '.handle',
      animation: reduceMotion ? 0 : 150,
      onEnd: function (evt) {
        if (evt.oldIndex === evt.newIndex) return;
        var moved = items.splice(evt.oldIndex, 1)[0];
        items.splice(evt.newIndex, 0, moved);
        clearResult();
        render();
        announce(moved.name + ' 파일이 ' + (evt.newIndex + 1) + '번째가 됐어요');
      }
    });
  }

  function setBusy(on) {
    mergeBtn.setAttribute('aria-busy', on ? 'true' : 'false');
    mergeBtn.textContent = on ? '합치는 중이에요' : '합치기';
  }

  function download(url) {
    var a = document.createElement('a');
    a.href = url; a.download = OUT_NAME;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function errorLine(text) {
    mergeError.innerHTML = ICON_WARN + '<span>' + escapeHtml(text) + '</span>';
  }

  mergeBtn.addEventListener('click', function () {
    if (mergeBtn.getAttribute('aria-busy') === 'true') return;
    clearResult();
    if (!libsOk) { errorLine('필요한 도구를 받지 못해서 합칠 수 없어요. 인터넷 연결을 확인하고 다시 열어 주세요.'); return; }
    if (items.some(function (it) { return it.loading; })) { errorLine('아직 파일을 살펴보고 있어요. 잠깐 뒤에 다시 눌러 주세요.'); return; }
    var good = okItems();
    if (good.length < 2) {
      errorLine(items.length && good.length < items.length
        ? '열 수 있는 파일이 두 개보다 적어요. 열 수 있는 PDF 파일을 더 올려 주세요.'
        : '합칠 파일이 모자라요. PDF 파일을 두 개 이상 올려 주세요.');
      return;
    }
    setBusy(true);
    var out;
    PDFLib.PDFDocument.create().then(function (doc) {
      out = doc;
      return good.reduce(function (p, it) {
        return p.then(function () {
          return PDFLib.PDFDocument.load(it.bytes, { updateMetadata: false }).then(function (src) {
            return out.copyPages(src, src.getPageIndices());
          }).then(function (pages) { pages.forEach(function (pg) { out.addPage(pg); }); });
        });
      }, Promise.resolve());
    }).then(function () {
      return out.save();
    }).then(function (bytes) {
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      download(lastUrl);
      var skipped = items.length - good.length;
      doneMsg.innerHTML = ICON_CHECK + '<div><strong>다 합쳤어요</strong><p>파일 ' + good.length + '개를 ' + out.getPageCount() + '쪽짜리 ' + OUT_NAME + ' 로 내려받았어요.</p>' +
        (skipped ? '<p class="small">열 수 없는 파일 ' + skipped + '개는 빼고 합쳤어요.</p>' : '') +
        '<div class="actions"><button type="button" class="btn" id="again">' + ICON_DOWNLOAD + '다시 내려받기</button></div></div>';
      $('again').addEventListener('click', function () { download(lastUrl); });
    }).catch(function () {
      errorLine('파일을 합치지 못했어요. 파일 하나가 망가졌을 수 있어요. 파일을 하나씩 빼 보고 다시 눌러 주세요.');
    }).then(function () { setBusy(false); });
  });

  // 파일 고르기와 끌어다 놓기
  $('pick').addEventListener('click', function () { fileInput.click(); });
  $('pick-empty').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });

  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1; }
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { if (!hasFiles(e)) return; e.preventDefault(); drop.classList.add('is-over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function () { drop.classList.remove('is-over'); });
  });
  // 화면 어디에 놓아도 목록에 올리고, 브라우저가 파일을 열지 않게
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function (e) { if (hasFiles(e)) { e.preventDefault(); addFiles(e.dataTransfer.files); } });

  render();
})();
</script>
</body>
</html>
